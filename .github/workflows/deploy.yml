name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: "22"
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag "portfolio:${GITHUB_SHA}" .

      - name: Export Docker image
        run: docker save "portfolio:${GITHUB_SHA}" | gzip > portfolio-image.tar.gz

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      - name: Prepare deployment directory
        run: >-
          ssh -i "$HOME/.ssh/deploy_key"
          -p "$SERVER_PORT"
          "$SERVER_USER@$SERVER_HOST"
          "mkdir -p '$DEPLOY_PATH'"

      - name: Upload image and Compose configuration
        run: >-
          scp -i "$HOME/.ssh/deploy_key"
          -P "$SERVER_PORT"
          compose.yaml portfolio-image.tar.gz
          "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

      - name: Load image and restart service
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && printf 'IMAGE_TAG=%s\\n' '$GITHUB_SHA' > .env && docker load < portfolio-image.tar.gz && docker compose up -d --remove-orphans && rm portfolio-image.tar.gz && curl --fail --retry 10 --retry-delay 2 http://localhost:8081/ >/dev/null"
