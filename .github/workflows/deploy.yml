name: Build & Deploy React App via SSH & Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v3

      - name: 🐳 Build Docker image
        run: |
          docker build -t portfolio2 .

      - name: 📦 Save image to tarball
        run: docker save portfolio2 -o portfolio2.tar

      - name: 🗝️ Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 📤 Copy Docker image to server
        run: scp -o StrictHostKeyChecking=no portfolio2.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/portfolio2.tar

      - name: 🚀 Deploy Docker container on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e
            docker load -i /tmp/portfolio2.tar &&
            (docker rm -f portfolio2 >/dev/null 2>&1 || true)
            docker run -d --restart unless-stopped --name portfolio2 -p 8081:8080 portfolio2
            rm /tmp/portfolio2.tar
            curl --fail --retry 10 --retry-delay 2 http://localhost:8081/ >/dev/null
          "
